name: Update citations from Google Scholar

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday, 03:17 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Fetch latest metrics and publications
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar.py

      - name: Commit changes
        run: |
          git add index.html data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update citations and publications from Google Scholar"
          git push
